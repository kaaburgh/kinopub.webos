name: A13 roadmap reconciliation helper

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.ref == 'agent-a13-hls-level-choices'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up repository Node and Yarn
        uses: ./.github/actions/setup-node-yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Prepare A13 roadmap reconciliation
        run: python3 scripts/a13-roadmap-temp.py prepare

      - name: Format roadmap
        run: yarn prettier ROADMAP.md --write

      - name: Validate formatting
        run: yarn format:check

      - name: Validate documentation links
        run: yarn check:docs

      - name: Validate diff
        run: git diff --check

      - name: Publish self-cleaned roadmap commit
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: python3 scripts/a13-roadmap-temp.py publish
