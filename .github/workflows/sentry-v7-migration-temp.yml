name: Temporary Sentry 7 migration helper

on:
  push:
    branches:
      - dependabot/npm_and_yarn/sentry/browser-7.119.1

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dependabot/npm_and_yarn/sentry/browser-7.119.1
          fetch-depth: 1
      - uses: ./.github/actions/setup-node-yarn
        with:
          install: 'true'
      - name: Align Sentry packages and v7 API
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/utils/logging.ts')
          text = path.read_text()

          exact = {
              "import { Integrations as TracingIntegrations } from '@sentry/tracing';": "import { BrowserTracing } from '@sentry/tracing';",
              'integrations: [new TracingIntegrations.BrowserTracing()],': 'integrations: [new BrowserTracing()],',
          }
          for old, new in exact.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one occurrence: {old}')
              text = text.replace(old, new)

          severity = {
              'Sentry.Severity.Warning': "'warning'",
              'Sentry.Severity.Error': "'error'",
              'Sentry.Severity.Info': "'info'",
          }
          for old, new in severity.items():
              if old not in text:
                  raise SystemExit(f'expected at least one occurrence: {old}')
              text = text.replace(old, new)

          path.write_text(text)
          PY
          yarn add @sentry/tracing@7.119.1 --exact
          yarn prettier src/utils/logging.ts --write
          yarn install --frozen-lockfile
      - name: Validate migration
        shell: bash
        run: |
          set -euo pipefail
          yarn lint
          yarn format:check
          yarn typecheck
          CI=true yarn test --watchAll=false
          yarn check:docs
          yarn build
          yarn check:es5
          yarn package
          test -f "out/kinopub.webos_v$(node -p "require('./package.json').version").ipk"
          git diff --check
      - name: Publish durable migration and self-clean
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/dependabot/npm_and_yarn/sentry/browser-7.119.1)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/sentry-v7-migration-temp.yml
          git add package.json yarn.lock src/utils/logging.ts
          git diff --cached --check
          git commit -m 'fix: complete Sentry 7 migration'
          git push origin HEAD:dependabot/npm_and_yarn/sentry/browser-7.119.1
