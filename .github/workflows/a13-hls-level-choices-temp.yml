name: A13 exact HLS level choices helper

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  prepare-and-publish:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent-a13-hls-level-choices'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 14
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Prepare exact HLS level choices
        run: python3 scripts/a13-hls-level-choices-temp.py prepare
      - name: Format changed files
        run: yarn prettier src/components/media/media.new.tsx src/utils/hlsLevels.ts src/utils/hlsLevels.test.ts --write
      - name: Validate formatting
        run: yarn format:check
      - name: Validate types
        run: yarn typecheck
      - name: Validate lint
        run: yarn lint
      - name: Validate tests
        run: CI=true yarn test --watchAll=false
      - name: Validate playback scenarios
        run: yarn test --watchAll=false --testPathPattern=media.scenarios
      - name: Validate build
        run: yarn build
      - name: Validate ES5 output
        run: yarn check:es5
      - name: Validate diff
        run: git diff --check
      - name: Publish durable implementation and remove helper
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: python3 scripts/a13-hls-level-choices-temp.py publish
