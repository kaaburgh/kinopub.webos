name: A16 subtitle style cleanup helper

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  publish-subtitle-style-cleanup:
    if: github.head_ref == 'agent-a16-subtitle-style-cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Prepare subtitle style cleanup
        run: python3 scripts/a16-subtitle-style-temp.py prepare

      - name: Format changed source
        run: yarn prettier src/components/player/player.tsx --write

      - name: Validate
        run: |
          yarn format:check
          yarn typecheck
          yarn lint
          CI=true yarn test --watchAll=false
          yarn build
          yarn check:es5
          git diff --check

      - name: Publish durable source commit and remove helper
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: python3 scripts/a16-subtitle-style-temp.py publish
