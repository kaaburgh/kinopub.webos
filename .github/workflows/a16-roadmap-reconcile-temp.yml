name: A16 roadmap reconciliation helper

on:
  pull_request:

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.number == 66
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js and Yarn
        uses: ./.github/actions/setup-node-yarn

      - name: Prepare A16 roadmap reconciliation
        run: python3 ./scripts/a16-roadmap-reconcile-temp.py prepare

      - name: Format roadmap
        run: yarn prettier ROADMAP.md --write

      - name: Validate documentation
        run: |
          yarn format:check
          yarn check:docs
          git diff --check

      - name: Publish self-cleaning reconciliation commit
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: python3 ./scripts/a16-roadmap-reconcile-temp.py publish
