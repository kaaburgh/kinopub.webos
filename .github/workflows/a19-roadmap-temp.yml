name: A19 roadmap reconciliation helper

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.number == 80
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Prepare A19 roadmap reconciliation
        run: python3 scripts/a19-roadmap-temp.py prepare

      - run: yarn prettier ROADMAP.md --write
      - run: yarn format:check
      - run: yarn check:docs
      - run: git diff --check

      - name: Publish self-cleaned A19 roadmap reconciliation
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: python3 scripts/a19-roadmap-temp.py publish
