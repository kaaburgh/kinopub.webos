name: A16 subtitle style roadmap reconciliation helper

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  reconcile-a16-subtitle-style-roadmap:
    if: github.event.pull_request.number == 72
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '14.21.3'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Prepare A16 roadmap reconciliation
        run: python3 scripts/a16-subtitle-roadmap-temp.py prepare

      - name: Format roadmap
        run: yarn prettier ROADMAP.md --write

      - name: Validate roadmap reconciliation
        run: |
          yarn format:check
          yarn check:docs
          git diff --check

      - name: Publish self-cleaned roadmap reconciliation
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: python3 scripts/a16-subtitle-roadmap-temp.py publish
