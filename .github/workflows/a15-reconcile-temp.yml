name: A15 reconciliation helper

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  reconcile-a15:
    if: github.head_ref == 'agent-a15-truth-spec'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '14.21.3'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Correct temporary helper update-ref endpoint
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/a15-reconcile-temp.py')
          text = path.read_text()
          old = "request('PATCH', ref_path, {'sha': commit, 'force': False})"
          new = "request('PATCH', '/git/refs/heads/' + urllib.parse.quote(BRANCH, safe=''), {'sha': commit, 'force': False})"
          if text.count(old) != 1:
              raise RuntimeError('expected exactly one update-ref call to correct')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Reconcile specification and roadmap atomically
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/a15-reconcile-temp.py
