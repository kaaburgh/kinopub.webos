name: A13 exact HLS rendition identity helper

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  prepare-and-publish:
    if: github.head_ref == 'agent-a13-hls-level-choices'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 14.21.3
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Prepare stable HLS rendition identity fix
        run: python3 scripts/a13-hls-level-identity-temp.py prepare

      - name: Format changed files
        run: yarn prettier src/components/media/media.new.tsx src/utils/hlsLevels.ts src/utils/hlsLevels.test.ts --write

      - name: Validate formatting
        run: yarn format:check

      - name: Validate types
        run: yarn typecheck

      - name: Validate lint
        run: yarn lint

      - name: Validate tests
        run: CI=true yarn test --watchAll=false

      - name: Validate playback scenarios
        run: yarn test --watchAll=false --testPathPattern=media.scenarios

      - name: Validate build
        run: yarn build

      - name: Validate ES5 output
        run: yarn check:es5

      - name: Validate diff
        run: git diff --check

      - name: Publish durable identity fix and remove helper
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: python3 scripts/a13-hls-level-identity-temp.py publish
