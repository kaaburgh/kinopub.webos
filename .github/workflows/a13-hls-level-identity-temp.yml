name: A13 exact HLS rendition identity helper

on:
  push:
    branches:
      - agent-a13-hls-level-choices

permissions:
  contents: write

jobs:
  prepare-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node.js and Yarn
        uses: actions/setup-node@v4
        with:
          node-version: 14
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Prepare stable HLS rendition identity fix
        run: python3 scripts/a13-hls-level-identity-temp.py prepare

      - name: Format changed files
        run: yarn prettier src/components/media/media.new.tsx src/utils/hlsLevels.ts src/utils/hlsLevels.test.ts --write

      - name: Validate formatting
        run: yarn format:check

      - name: Validate types
        run: yarn typecheck

      - name: Validate lint
        run: yarn lint

      - name: Validate tests
        run: CI=true yarn test --watchAll=false

      - name: Validate playback scenarios
        run: yarn test --watchAll=false --testPathPattern=media.scenarios

      - name: Validate build
        run: yarn build

      - name: Validate ES5 output
        run: yarn check:es5

      - name: Validate diff
        run: git diff --check

      - name: Publish durable identity fix and remove helper
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
          HEAD_BRANCH: ${{ github.ref_name }}
        run: python3 scripts/a13-hls-level-identity-temp.py publish
