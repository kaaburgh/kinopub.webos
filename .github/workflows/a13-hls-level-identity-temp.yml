name: A13 exact HLS rendition identity helper

on:
  push:
    branches:
      - agent-a13-hls-level-choices

permissions:
  contents: write

jobs:
  prepare-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node.js and Yarn
        uses: actions/setup-node@v4
        with:
          node-version: 14
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Correct helper reference-count guard
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/a13-hls-level-identity-temp.py')
          text = path.read_text(encoding='utf-8')
          old_count = 'if media.count("fixedHlsLevelNameRef.current") != 2:'
          new_count = 'if media.count("fixedHlsLevelNameRef.current") != 3:'
          old_message = 'fixed HLS name ref: expected two remaining selection/recovery references'
          new_message = 'fixed HLS name ref: expected three remaining selection/recovery references'
          if text.count(old_count) != 1 or text.count(old_message) != 1:
              raise SystemExit('expected exactly one stale reference-count guard and message')
          text = text.replace(old_count, new_count, 1).replace(old_message, new_message, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Prepare stable HLS rendition identity fix
        run: python3 scripts/a13-hls-level-identity-temp.py prepare

      - name: Make rendition recovery fail closed on fingerprint collisions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          levels_path = Path('src/utils/hlsLevels.ts')
          levels = levels_path.read_text(encoding='utf-8')
          old_lookup = '''export function findHlsFixedLevelChoiceByFingerprint(levels: readonly LevelLike[] | undefined, fingerprint: string) {
            const index = (levels || []).findIndex((level) => getHlsFixedLevelFingerprint(level) === fingerprint);
            return index === -1 ? undefined : { index, name: getHlsFixedLevelSourceName(levels![index], index) };
          }'''
          new_lookup = '''export function findHlsFixedLevelChoiceByFingerprint(levels: readonly LevelLike[] | undefined, fingerprint: string) {
            const matchingIndexes = (levels || []).reduce<number[]>((indexes, level, index) => {
              if (getHlsFixedLevelFingerprint(level) === fingerprint) {
                indexes.push(index);
              }
              return indexes;
            }, []);

            if (matchingIndexes.length !== 1) {
              return undefined;
            }

            const index = matchingIndexes[0];
            return { index, name: getHlsFixedLevelSourceName(levels![index], index) };
          }'''
          if levels.count(old_lookup) != 1:
              raise SystemExit(f'expected exactly one pre-collision fingerprint lookup, found {levels.count(old_lookup)}')
          levels_path.write_text(levels.replace(old_lookup, new_lookup, 1), encoding='utf-8')

          test_path = Path('src/utils/hlsLevels.test.ts')
          test = test_path.read_text(encoding='utf-8')
          marker = '''  test('falls back to a deterministic level label when dimensions are unavailable', () => {
            expect(getHlsFixedLevelSourceName({}, 0)).toBe('HLS 1: качество неизвестно');
          });'''
          collision = '''  test('fails closed when rendition fingerprints collide', () => {
            const collidingLevels = [
              { width: 1920, height: 804, bitrate: 4000000, videoCodec: 'avc1.640028' },
              { width: 1920, height: 804, bitrate: 4000000, videoCodec: 'avc1.640028' },
            ];
            const fingerprint = getHlsFixedLevelFingerprint(collidingLevels[0]);

            expect(findHlsFixedLevelChoiceByFingerprint(collidingLevels, fingerprint)).toBeUndefined();
          });

'''
          if test.count(marker) != 1:
              raise SystemExit(f'expected exactly one fallback-label test marker, found {test.count(marker)}')
          test_path.write_text(test.replace(marker, collision + marker, 1), encoding='utf-8')
          PY

      - name: Format changed files
        run: yarn prettier src/components/media/media.new.tsx src/utils/hlsLevels.ts src/utils/hlsLevels.test.ts --write

      - name: Validate formatting
        run: yarn format:check

      - name: Validate types
        run: yarn typecheck

      - name: Validate lint
        run: yarn lint

      - name: Validate tests
        run: CI=true yarn test --watchAll=false

      - name: Validate playback scenarios
        run: yarn test --watchAll=false --testPathPattern=media.scenarios

      - name: Validate build
        run: yarn build

      - name: Validate ES5 output
        run: yarn check:es5

      - name: Validate diff
        run: git diff --check

      - name: Publish durable identity fix and remove helper
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
          HEAD_BRANCH: ${{ github.ref_name }}
        run: python3 scripts/a13-hls-level-identity-temp.py publish
