name: One-shot ARK regeneration

on:
  push:
    branches: [agent/enable-unattended-agent-cycle]
    paths:
      - '.github/workflows/zz-ark-upgrade-once.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/enable-unattended-agent-cycle
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Acquire and verify pinned ARK 0.1.13
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/kaaburgh/agentic-repo-kit/releases/download/v0.1.13/agentic-repo-kit-0.1.13.pyz'
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 -o "$RUNNER_TEMP/ark.pyz" "$url"
          actual="$(sha256sum "$RUNNER_TEMP/ark.pyz" | awk '{print $1}')"
          test "$actual" = 'b1b7b23f1082dd3998cf01f6335a571aa695eb422a99aa1809e8e5770317c985'
      - name: Regenerate and validate contract
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/ark.pyz" upgrade .
          python "$RUNNER_TEMP/ark.pyz" check .
          rm .github/workflows/zz-ark-upgrade-once.yml
      - name: Commit deterministic generated output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'build: regenerate unattended agent cycle contract'
          git push origin HEAD:agent/enable-unattended-agent-cycle
