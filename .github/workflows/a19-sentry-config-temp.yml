name: A19 Sentry config helper

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent-a19-sentry-config'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js and Yarn
        uses: ./.github/actions/setup-node-yarn

      - name: Prepare bounded A19 source/config change
        run: python3 scripts/a19-sentry-config-temp.py prepare

      - name: Format changed TypeScript
        run: yarn prettier src/utils/logging.ts src/utils/enviroment.ts src/utils/enviroment.test.ts --write

      - name: Check formatting
        run: yarn format:check

      - name: TypeScript
        run: yarn typecheck

      - name: ESLint
        run: yarn lint

      - name: Tests
        run: yarn test --watchAll=false
        env:
          CI: 'true'

      - name: Build app
        run: yarn build

      - name: Check the bundle is ES5
        run: yarn check:es5

      - name: Check diff
        run: git diff --check

      - name: Publish self-cleaning implementation commit
        run: python3 scripts/a19-sentry-config-temp.py publish
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
