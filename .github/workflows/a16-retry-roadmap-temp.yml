name: A16 retry timer roadmap reconciliation helper

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  reconcile-a16-retry-roadmap:
    if: github.event.pull_request.number == 70
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 14.21.3
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Prepare A16 roadmap reconciliation
        run: python3 scripts/a16-retry-roadmap-temp.py prepare

      - name: Format roadmap
        run: yarn prettier ROADMAP.md --write

      - name: Validate reconciliation
        run: |
          yarn format:check
          yarn check:docs
          git diff --check

      - name: Publish self-cleaned roadmap commit
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: python3 scripts/a16-retry-roadmap-temp.py publish
