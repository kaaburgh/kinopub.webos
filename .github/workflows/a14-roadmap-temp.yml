name: A14 roadmap reconciliation helper

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.number == 78
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Use Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Prepare A14 roadmap reconciliation
        env:
          MODE: prepare
        run: python3 scripts/a14-roadmap-temp.py

      - name: Format reconciled roadmap
        run: yarn prettier ROADMAP.md --write

      - name: Check repository formatting
        run: yarn format:check

      - name: Check documentation links
        run: yarn check:docs

      - name: Check diff whitespace
        run: git diff --check

      - name: Publish self-cleaned reconciliation
        env:
          MODE: publish
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: python3 scripts/a14-roadmap-temp.py
