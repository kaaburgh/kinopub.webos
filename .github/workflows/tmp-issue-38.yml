name: Temporary issue 38 patch

on:
  push:
    branches:
      - agent/issue-38-segment-pipeline

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-38-segment-pipeline
          fetch-depth: 0
      - name: Apply bounded diagnostics patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/player/playbackDiagnostics.tsx')
          text = path.read_text()
          old = """function formatBufferAppendStages(stages: BufferAppendStagesByType) {\n  const entries = Object.entries(stages);\n\n  if (!entries.length) {\n    return 'idle';\n  }\n\n  return entries.map(([bufferType, stage]) => `${bufferType}: ${formatBufferAppendStageValue(stage)}`).join('; ');\n}\n"""
          new = old + """\nfunction formatBufferAppendOverlayStages(stages: BufferAppendStagesByType) {\n  const entries = Object.entries(stages);\n\n  if (!entries.length) {\n    return 'idle';\n  }\n\n  return entries\n    .map(([bufferType, stage]) =>\n      stage.status === 'appending'\n        ? `${bufferType} appending ${formatSeconds((Date.now() - stage.startedAt) / 1000)}`\n        : `${bufferType} appended ${formatSeconds(stage.durationSeconds)}`,\n    )\n    .join(' · ');\n}\n"""
          if text.count(old) != 1:
              raise SystemExit('expected formatter block exactly once')
          text = text.replace(old, new)
          old_use = 'append: {formatBufferAppendStages(bufferAppendStages)}'
          new_use = 'append: {formatBufferAppendOverlayStages(bufferAppendStages)}'
          if text.count(old_use) != 1:
              raise SystemExit('expected overlay formatter use exactly once')
          path.write_text(text.replace(old_use, new_use))

          Path('.github/workflows/tmp-issue-38.yml').unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/player/playbackDiagnostics.tsx .github/workflows/tmp-issue-38.yml
          git commit -m "fix: compact Segment Pipeline append status"
          git push origin HEAD:agent/issue-38-segment-pipeline
